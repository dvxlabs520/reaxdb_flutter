name: reaxdb_flutter
description: "Flutter companion for ReaxDB. Opens databases in the app support directory, keeps the encryption key in the Keychain or Keystore, and turns queries into streams for StreamBuilder."
version: 0.2.0
homepage: https://github.com/dvxlabs520/reaxdb_flutter
repository: https://github.com/dvxlabs520/reaxdb_flutter
issue_tracker: https://github.com/dvxlabs520/reaxdb_flutter/issues

topics:
  - database
  - nosql
  - offline-first
  - storage
  - encryption

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.0
  flutter_secure_storage: ^11.0.0
  path: ^1.9.0
  path_provider: ^2.1.5
  reaxdb_dart: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
