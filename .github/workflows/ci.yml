name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Flutter ${{ matrix.flutter }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The current stable release and the one before it.
        flutter: ['3.47.7', '3.44.8']
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true

      # reaxdb_dart comes from pub.dev, exactly as it does for users.
      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test example/integration_test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Analyze and test the example app
        working-directory: example
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test

      - name: Check the package can be published
        run: flutter pub publish --dry-run
